<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#c8102e">
  <title>{% if page.title and page.url != "/" %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="preload" href="{{ '/assets/fonts/source-serif-4-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c8102e'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
  {% if page.math %}
  <script>window.MathJax = { tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] } };</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  {% endif %}
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      {% if page.url == "/" %}
      <h1 class="site-name">{{ site.title }}</h1>
      {% else %}
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      {% endif %}
      <nav>
        <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/random/' | relative_url }}"{% if page.url == "/random/" %} aria-current="page"{% endif %}>Random</a>
        <a href="{{ '/art-and-essays/' | relative_url }}"{% if page.url == "/art-and-essays/" or page.collection == "essays" %} aria-current="page"{% endif %}>Art &amp; Essays</a>
        <a href="{{ site.cv | relative_url }}">CV</a>
      </nav>
    </header>

    <main>
{{ content }}
    </main>

    <footer class="site-footer">
      © {{ site.time | date: "%Y" }} Slimane Alaoui Soulimani Valenti
    </footer>
  </div>
</body>
</html>
